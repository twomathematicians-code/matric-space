[build-system]
requires = [
    "setuptools>=68.0",
    "torch>=2.0",
    "wheel>=0.40",
]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-groups"
version = "2.0.0"
description = "Computational kernel for matrix Lie groups (SO(n), SE(3), SymPD) with PyTorch autograd support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Matrix Groups Working Group"},
]
keywords = [
    "lie-groups",
    "so3",
    "se3",
    "rotation",
    "pytorch",
    "cuda",
    "rigid-body",
    "manifold-optimization",
    "spd-matrix",
    "rodrigues",
    "slerp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "torch-cuda-testing",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme",
]

[project.urls]
Homepage = "https://github.com/matrix-groups/matrix-groups"
Repository = "https://github.com/matrix-groups/matrix-groups"
Issues = "https://github.com/matrix-groups/matrix-groups/issues"
